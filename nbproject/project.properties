application.title=Library Management System
application.vendor=Piyush

debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
build.dir=build
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
dist.dir=dist
dist.jar=${dist.dir}/Library-Management-System.jar
dist.javadoc.dir=${dist.dir}/api-docs

includes=**
excludes=
main.class=library.management.system.Main
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF

javac.source=17
javac.target=17
javac.release=17
javac.encoding=UTF-8
# Keep Connector/J relative to the project so the project opens on another machine.
mysql.driver=lib/mysql-connector-j.jar
file.reference.mysql-connector-j.jar=${mysql.driver}
javac.classpath=${file.reference.mysql-connector-j.jar}
javac.test.classpath=
javac.processorpath=${javac.classpath}
javac.test.processorpath=${javac.test.classpath}
javac.deprecation=false
javac.compilerargs=
run.classpath=${build.classes.dir}:${javac.classpath}
run.test.classpath=${build.classes.dir}:${javac.test.classpath}:${javac.classpath}
source.encoding=UTF-8

# Standard options consumed by the generated NetBeans Javadoc target.
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=Library Management System API

jar.compress=true
jar.index=false
